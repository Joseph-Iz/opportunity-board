# Runs on every push and pull request: install, typecheck, test the listing data, and build.
# A red X on GitHub means something below failed; open the run to see which step.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Installs exactly the versions pinned in package-lock.json, so every check
      # runs against the same code that was reviewed.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test listing data
        run: npm test

      - name: Build
        run: npm run build
